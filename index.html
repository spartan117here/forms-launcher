<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>forms-launcher</title>

  <!-- Preconnect & DNS-Prefetch to Google Forms for fast iframe start -->
  <link rel="preconnect" href="https://docs.google.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://docs.google.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <!-- PWA & Mobile Meta Tags -->
  <meta name="description" content="Always shows the latest Google Form instantly in full screen with offline support.">
  <meta name="theme-color" content="#0b0d14">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Apple iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="forms-launcher">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <!-- Critical First-Paint Background to prevent white flash -->
  <style>
    html, body {
      background-color: #0b0d14;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
  </style>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Deferred Application Scripts -->
  <script src="/js/config.js" defer></script>
  <script src="/js/app.js" defer></script>
</head>
<body>
  <div class="app-viewport">
    
    <!-- Top Slim App Navigation Bar -->
    <header class="top-bar">
      <div class="brand-wrapper">
        <div class="brand-logo" title="forms-launcher">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
            <!-- Rounded document body with top-right fold -->
            <path d="M 6 3 L 14.5 3 L 19 7.5 L 19 20 A 2 2 0 0 1 17 22 L 6 22 A 2 2 0 0 1 4 20 L 4 5 A 2 2 0 0 1 6 3 Z" fill="rgba(255,255,255,0.2)" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
            <!-- Fold flap -->
            <path d="M 14.5 3 L 14.5 7.5 L 19 7.5 Z" fill="#ffffff" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round"/>
            <!-- Checklist items: small dots + horizontal lines -->
            <circle cx="7.5" cy="11.5" r="0.9" fill="#ffffff"/>
            <line x1="10" y1="11.5" x2="16" y2="11.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="7.5" cy="15" r="0.9" fill="#ffffff"/>
            <line x1="10" y1="15" x2="16" y2="15" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="7.5" cy="18.5" r="0.9" fill="#ffffff"/>
            <line x1="10" y1="18.5" x2="13.5" y2="18.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-info">
          <h1 class="app-title" id="appTitle">forms-launcher</h1>
          <span class="form-subtitle" id="formSubtitle"></span>
        </div>
      </div>

      <div class="top-actions">
        <!-- Online/Offline Pill -->
        <div class="status-pill" id="statusPill" title="Connection status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Online</span>
        </div>

        <!-- Open in external browser button -->
        <a id="openExternalBtn" class="btn-icon" target="_blank" rel="noopener noreferrer" title="Open form in browser" aria-label="Open in browser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>

        <!-- Refresh button -->
        <button id="refreshBtn" class="btn-icon" title="Check for newest form" aria-label="Refresh form">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>


      </div>
    </header>

    <!-- Main Full-Screen Form Container -->
    <main class="iframe-container">
      <iframe
        id="formIframe"
        class="form-iframe"
        title="Google Form"
        loading="eager"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>

      <!-- State 2: Error Screen (Simple & Clean) -->
      <div id="errorOverlay" class="state-overlay hidden">
        <p class="error-msg-main">Couldn't load the form</p>
        <button id="retryBtn" class="btn btn-primary" style="margin-top: 14px;">Try again</button>
      </div>

      <!-- State 3: Empty Screen (No links published yet) -->
      <div id="emptyOverlay" class="state-overlay hidden">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#7248b9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 14px;">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <h2 class="state-title">No Form Published Yet</h2>
        <p class="state-description">The administrator has not added any form links yet. Check back soon.</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
          <button id="emptyRefreshBtn" class="btn btn-primary">Check Again</button>
        </div>
      </div>

      <!-- State 4: Setup Required Screen (Placeholders in config.js not yet filled) -->
      <div id="setupOverlay" class="state-overlay hidden">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 14px;">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <h2 class="state-title">Database Setup Required</h2>
        <p class="state-description">
          Open <code>js/config.js</code> and configure your Supabase URL and anonymous key.
        </p>
      </div>

    </main>

    <!-- Bottom Install App Toast / Banner (for Android & iOS PWA prompt) -->
    <div id="installBanner" class="install-banner hidden">
      <div class="install-content">
        <div class="install-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
        </div>
        <div>
          <div class="install-text">Install forms-launcher</div>
          <div class="install-sub">Add to home screen for 1-tap access</div>
        </div>
      </div>
      <div class="install-actions">
        <button id="dismissInstallBtn" class="btn-icon" style="width: 26px; height: 26px;" title="Dismiss">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <button id="installAppBtn" class="btn btn-primary btn-sm">Install</button>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

  </div>
</body>
</html>
